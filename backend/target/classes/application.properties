# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── MySQL Database ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/campus_transport?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nikkusql20
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ────────────────────────────────────────────────────────
# Generate your own with: openssl rand -base64 64
app.jwt.secret=SmartCampusTransportSecretKey2024VeryLongSecretKeyForJWTSigning1234567890ABCDEF
app.jwt.expiration-ms=86400000

# ── CORS (allow React dev server) ──────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ───────────────────────────────────────────────────
logging.level.com.campus=DEBUG
logging.level.org.springframework.security=INFO
